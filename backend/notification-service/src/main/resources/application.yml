server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    # Credentials are required and come from the environment (see .env.example). No defaults on purpose.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${JWT_ISSUER:https://auth.stayhotel.local}
          audiences: ${JWT_AUDIENCE:stay-hotel-api}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
