server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    # Credentials are required and come from the environment (see .env.example). No defaults on purpose.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${JWT_ISSUER:https://auth.stayhotel.local}
          audiences: ${JWT_AUDIENCE:stay-hotel-api}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  mail:
    # Dev: Mailpit (docker compose). Credentials optional; set SMTP_USERNAME/SMTP_PASSWORD for a real relay.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    mail:
      enabled: false   # an SMTP outage must not mark the service unhealthy: emails are retried (D-029)
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

notification:
  app-url: ${APP_PUBLIC_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@stayhotel.local}
  email-retry-interval: ${EMAIL_RETRY_INTERVAL:PT30S}

stayhotel:
  outbox:
    enabled: false   # consumer-only service: no outbox table
