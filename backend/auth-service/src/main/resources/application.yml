server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    # Credentials are required and come from the environment (see .env.example). No defaults on purpose.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        # The decoder itself is built locally from the signing key (JwtKeyConfig); these map roles to authorities.
        jwt:
          authorities-claim-name: roles
          authority-prefix: ROLE_
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  jwt:
    # Base64 PKCS#8 DER RSA private key (>= 2048 bit). Generate with scripts/generate-jwt-key.sh
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    key-id: ${AUTH_JWT_KEY_ID:auth-key-1}
    issuer: ${JWT_ISSUER:https://auth.stayhotel.local}
    audience: ${JWT_AUDIENCE:stay-hotel-api}
    access-token-ttl: 15m
    allow-ephemeral-key: ${AUTH_JWT_ALLOW_EPHEMERAL_KEY:false}
  refresh:
    ttl: 7d
    reuse-grace: 30s
    cookie-name: SH_REFRESH
    cookie-path: /api/v1/auth
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  login:
    max-failed-attempts: 5
    lockout-duration: 15m
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
