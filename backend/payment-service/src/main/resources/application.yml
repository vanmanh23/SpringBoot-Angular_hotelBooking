server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    # Credentials are required and come from the environment (see .env.example). No defaults on purpose.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${JWT_ISSUER:https://auth.stayhotel.local}
          audiences: ${JWT_AUDIENCE:stay-hotel-api}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

payment:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  refund-retry-after: 2m
  sandbox:
    # Shared HMAC secret of the simulated provider (>= 32 chars). Required; no default on purpose.
    webhook-secret: ${SANDBOX_WEBHOOK_SECRET}
    webhook-url: ${SANDBOX_WEBHOOK_URL:http://localhost:8084/api/v1/payments/webhooks/sandbox}
    webhook-tolerance: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

stayhotel:
  audit:
    enabled: true   # BR-32: staff actions recorded in audit_logs
