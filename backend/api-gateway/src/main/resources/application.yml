server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  hotel-url: ${HOTEL_SERVICE_URL:http://localhost:8082}
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  review-url: ${REVIEW_SERVICE_URL:http://localhost:8085}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          # CORS is handled by CorsWebFilter (CorsConfig). Guard against duplicate headers if a downstream ever adds its own.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials X-Correlation-Id, RETAIN_FIRST
          # Order matters: the more specific /hotels/{id}/reviews route must precede the generic /hotels/** route.
          routes:
            # Booking-owned views nested under manage/admin paths must precede the generic hotel/auth routes.
            - id: manage-hotel-bookings
              uri: ${services.booking-url}
              predicates:
                - Path=/api/v1/manage/hotels/*/bookings
            - id: admin-bookings
              uri: ${services.booking-url}
              predicates:
                - Path=/api/v1/admin/bookings,/api/v1/admin/bookings/**
            - id: admin-payments
              uri: ${services.payment-url}
              predicates:
                - Path=/api/v1/admin/payments,/api/v1/admin/payments/**
            - id: admin-reviews
              uri: ${services.review-url}
              predicates:
                - Path=/api/v1/admin/reviews/**
            - id: hotel-reviews
              uri: ${services.review-url}
              predicates:
                - Path=/api/v1/hotels/*/reviews,/api/v1/hotels/*/reviews/**
            - id: auth
              uri: ${services.auth-url}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users,/api/v1/admin/users/**
            - id: hotel
              uri: ${services.hotel-url}
              predicates:
                - Path=/api/v1/hotels,/api/v1/hotels/**,/api/v1/room-types/**,/api/v1/amenities,/api/v1/amenities/**,/api/v1/manage/hotels,/api/v1/manage/hotels/**
            - id: booking
              uri: ${services.booking-url}
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**,/api/v1/availability
            - id: payment
              uri: ${services.payment-url}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**,/sandbox-gateway/**
            - id: review
              uri: ${services.review-url}
              predicates:
                - Path=/api/v1/reviews,/api/v1/reviews/**
            - id: notification
              uri: ${services.notification-url}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
