server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
    # Credentials are required and come from the environment (see .env.example). No defaults on purpose.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${JWT_ISSUER:https://auth.stayhotel.local}
          audiences: ${JWT_AUDIENCE:stay-hotel-api}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  flyway:
    enabled: true
    locations: classpath:db/migration

booking:
  hold-duration: ${BOOKING_HOLD_DURATION:15m}
  hotel-service:
    url: ${HOTEL_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 3s
  jobs:
    enabled: ${BOOKING_JOBS_ENABLED:true}
    expiry-interval: 30s
    completion-interval: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
