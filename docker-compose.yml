# Local / single-host stack. Requires a .env file (copy .env.example).
# Business services are reachable only through the gateway; infra ports bind to 127.0.0.1.

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &service-env
    DB_HOST: postgres
    DB_PORT: "5432"
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
    JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD:?}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: [tools]   # opt-in: docker compose --profile tools up -d pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres: { condition: service_healthy }

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  auth-service:
    <<: *service-defaults
    build: { context: ./backend, dockerfile: auth-service/Dockerfile }
    environment:
      <<: *service-env
      DB_NAME: auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?generate with scripts/generate-jwt-key.sh}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-auth-key-1}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  hotel-service:
    <<: *service-defaults
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    build: { context: ./backend, dockerfile: hotel-service/Dockerfile }
    environment:
      <<: *service-env
      DB_NAME: hotel_db
      DB_USERNAME: hotel_user
      DB_PASSWORD: ${HOTEL_DB_PASSWORD:?}

  booking-service:
    <<: *service-defaults
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    build: { context: ./backend, dockerfile: booking-service/Dockerfile }
    environment:
      <<: *service-env
      DB_NAME: booking_db
      DB_USERNAME: booking_user
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_HOLD_DURATION: ${BOOKING_HOLD_DURATION:-15m}

  payment-service:
    <<: *service-defaults
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    build: { context: ./backend, dockerfile: payment-service/Dockerfile }
    environment:
      <<: *service-env
      DB_NAME: payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      SANDBOX_WEBHOOK_SECRET: ${SANDBOX_WEBHOOK_SECRET:?set SANDBOX_WEBHOOK_SECRET in .env}
      SANDBOX_WEBHOOK_URL: http://payment-service:8084/api/v1/payments/webhooks/sandbox
      BOOKING_SERVICE_URL: http://booking-service:8083
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4200}

  review-service:
    <<: *service-defaults
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    build: { context: ./backend, dockerfile: review-service/Dockerfile }
    environment:
      <<: *service-env
      DB_NAME: review_db
      DB_USERNAME: review_user
      DB_PASSWORD: ${REVIEW_DB_PASSWORD:?}

  notification-service:
    <<: *service-defaults
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    build: { context: ./backend, dockerfile: notification-service/Dockerfile }
    environment:
      <<: *service-env
      DB_NAME: notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      # Dev default: Mailpit. For a real relay set SMTP_* in .env (credentials never in this file).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@stayhotel.local}
      APP_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:4200}

  # Dev mail catcher: every email the stack sends lands here (web UI on 127.0.0.1 only).
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "2000"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-gateway:
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      REVIEW_SERVICE_URL: http://review-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service: { condition: service_healthy }
      hotel-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      review-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  postgres-data:
  pgadmin-data:
  kafka-data:
