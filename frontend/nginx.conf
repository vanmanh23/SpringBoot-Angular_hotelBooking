server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Note: an add_header inside a location drops all inherited add_header directives,
    # so every location includes the security header snippet explicitly.

    # Same-origin API access: the browser never talks to the gateway directly.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Simulated payment provider's hosted checkout (D-023). A real provider would live on its own domain.
    location /sandbox-gateway/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Hashed bundles can be cached forever; index.html must not be.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
